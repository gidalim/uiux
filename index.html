<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>캘린더 서비스</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 일정 정리용 캘린더 서비스 
  사용자: 개인, 팀
  목적: 주간 일정 관리, 월간 일정 관리
  핵심 행동: 날짜, 태그, 내용 등을 제공하며 사용자가 일정을 등록, 관리할 수 있도록 지원
  정보 순서: 날짜, 만료여부, 태그, 내용
  -->

  <header>
    <h1>캘린더 서비스</h1>
    <p>과제와 학습일정을 정리합니다</p>
    <button id="themeButton" type="button" aria-label="테마 전환">☀️</button>
    <nav aria-label="주요 메뉴">
      <a href="#about">서비스 소개</a>
      <a href="#calendar">캘린더</a>
      <a href="#tag">태그 목록</a>
      <a href="#detail">일정 상세</a>
    </nav>
  </header> 
    <main>
      <section id="about"> 
        <h2>서비스 소개</h2>
        <h3>사용 방법</h3>
          <img src="assets/images/header_img.png"  alt="헤더 일러스트">
          <p>개인 및 팀단위로 일정을 관리합니다</p>
          <p>태그와 짧은 내용을 통해 직관적 서비스를 제공합니다</p>
      </section>
      <section id="calendar"> 
        <!-- 캘린더 박스 -->
        <div class="calendar_header">
          <button id="prevMonthButton" type="button" aria-label="이전 달">◀</button>
          <h2 id="calendarTitle" aria-live="polite">캘린더</h2>
          <button id="nextMonthButton" type="button" aria-label="다음 달">▶</button>
        </div>
        <div class="view_tab_group" role="tablist" aria-label="월간 주간 전환">
          <button id="tabMonth" role="tab" aria-selected="true" aria-controls="calendarList" tabindex="0">월간</button>
          <button id="tabWeek" role="tab" aria-selected="false" aria-controls="calendarList" tabindex="-1">주간</button>
        </div>
        <ul class="calendar_weekdays" aria-hidden="true">
          <li>일</li>
          <li>월</li>
          <li>화</li>
          <li>수</li>
          <li>목</li>
          <li>금</li>
          <li>토</li>
        </ul>
         <ul class="calendar_list" id="calendarList">
         </ul>
      </section>
      <section id="tag" class="tag_box">
        <h2>태그</h2> 
          <h3>태그 생성</h3>
          <form id="tag_form">
            <label for="tag_name">태그 이름</label>

            <div class="tag_input_wrapper">
              <input type="text" id="tag_name" name="tag_name" placeholder="이름을 작성해주세요">
              <ul class="tag_dropdown" id="tagDropdown" hidden></ul>
            </div>
            <button id="tagSubmitButton" type="submit">만들기</button>
          </form>
            <p id="tagMessage" aria-live="polite">
              하단의 태그를 사용하여 일정을 구분합니다.
            </p>
            <ol class="tagList" id="tagList"> 
              
            </ol>  
      </section>
      <section id="detail">
        <h2>개발자 페이지</h2>
        <a href="https://github.com/gidalim/uiux" target="_blank">
          <img src="assets/images/github_mark.png" alt="깃허브 일러스트">
        </a>
      </section>
    </main>
  <footer>
    <small>2026 하반기 캘린더 프로젝트</small>
  </footer>
  <script src="script.js"></script>
</body>
</html>
