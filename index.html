<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>캘린더 서비스</title>
</head>
<body>
  <!-- 일정 정리용 캘린더 서비스 
  사용자: 개인, 팀
  목적: 주간 일정 관리, 월간 일정 관리
  핵심 행동: 날짜, 태그, 내용 등을 제공하며 사용자가 일정을 등록, 관리할 수 있도록 지원
  정보 순서: 날짜, 만료여부, 태그, 내용
  -->

  <header>
    <h1>캘린더 서비스</h1>
    <p>과제와 학습일정을 정리합니다</p>
    <nav aria-label="주요 메뉴">
      <a href="#about">서비스 소개</a>
      <a href="#calendar">캘린더</a>
      <a href="#tag">태그 목록</a>
      <a href="#detail">일정 상세</a>
    </nav>
  </header> 
    <main>
      <section id="about"> 
        <h2>서비스 소개</h2>
        <h3>사용 방법</h3>
          <img src="assets/images/header_img.png"  alt="헤더 일러스트">
          <p>개인 및 팀단위로 일정을 관리합니다</p>
          <p>태그와 짧은 내용을 통해 직관적 서비스를 제공합니다</p>
      </section>
      <section id="calendar"> 
        <h2>월</h2>
        <!-- 캘린더 박스 -->
         <ul>1</ul>
         <ul>2</ul>
         <ul>3</ul>
      </section>
      <section id="tag">
        <h2>태그</h2> 
          <h3>태그 생성</h3>
          <form>
            <label for="tag_name">태그 이름</label>
            <input type="text" id="tag_name" name="tag_name" placeholder="이름을 작성해주세요">
            <button type="submit">만들기</button>
          </form>
            <ol> 
              <li>외부 일정</li>  
              <li>과제</li>  
              <li>강의</li>  
            </ol>  
      </section>
      <section id="detail">
        <h2>개발자 페이지</h2>
        <a href="https://github.com/gidalim/uiux" target="_blank">
          <img src="assets/images/github_mark.png" alt="깃허브 일러스트">
        </a>
      </section>
    </main>
  <footer>
    <small>2026 하반기 캘린더 프로젝트</small>
  </footer>
</body>
</html>
